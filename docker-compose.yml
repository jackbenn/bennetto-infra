# Cap each container's Docker log at 3 files of 10 MB. Docker's default keeps
# it whole until the container is recreated, and nginx's (every request) grew
# 35 MB in 12 days on the small disk. See INFRA-11.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./website:/var/www/html:ro
      - ./football-graphs/web:/var/www/football:ro
      - /var/www/football-games:/var/www/football-games:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gengo-web
      - taking-the-story
      - bookclub
    restart: unless-stopped
    logging: *logging

  gengo-web:
    build:
      context: .
      dockerfile: docker/gengo-web.Dockerfile
    restart: unless-stopped
    logging: *logging
    expose:
      - "5000"

  gengo-ws:
    build:
      context: .
      dockerfile: docker/gengo-ws.Dockerfile
    restart: unless-stopped
    logging: *logging
    expose:
      - "8765"    # reached only through nginx's /gengo/ws

  taking-the-story:
    build:
      context: .
      dockerfile: docker/taking-the-story.Dockerfile
    volumes:
      - taking_the_story_data:/data
    restart: unless-stopped
    logging: *logging
    expose:
      - "8000"

  bookclub:
    build:
      context: ./bookclub
      dockerfile: Dockerfile
    volumes:
      - bookclub_data:/data
    env_file:
      - ./bookclub.env
    restart: unless-stopped
    logging: *logging
    expose:
      - "8000"

volumes:
  taking_the_story_data:
  bookclub_data:
