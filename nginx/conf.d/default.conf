map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's internal DNS — lets nginx resolve upstreams at request time
# rather than startup, so a crashed container doesn't prevent nginx starting.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name bennetto.com www.bennetto.com;

    # Let's Encrypt HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bennetto.com www.bennetto.com;

    ssl_certificate     /etc/letsencrypt/live/bennetto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bennetto.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Static website
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # gengo Flask app
    location /gengo/ {
        set $upstream_gengo http://gengo-web:5000;
        proxy_pass $upstream_gengo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gengo WebSocket server
    location /gengo/ws {
        set $upstream_gengo_ws http://gengo-ws:8765;
        proxy_pass $upstream_gengo_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # taking_the_story FastAPI app
    location /story/ {
        set $upstream_story http://taking-the-story:8000;
        proxy_pass $upstream_story;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
