map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # football-graphs: static files only. The page is the submodule's web/;
    # the game files are fetched daily from its GitHub release by
    # scripts/fetch-football.sh, gzipped only, so nginx sends the .gz as is,
    # and unzips it for a client that doesn't take gzip.
    location = /football {
        absolute_redirect off;    # keeps the port, for localhost:8080
        return 301 /football/;
    }

    location /football/ {
        alias /var/www/football/;
    }

    location /football/games/ {
        alias /var/www/football-games/;
        gzip_static always;
        gunzip on;
        autoindex on;    # the page lists the seasons from this
        autoindex_format json;
    }

    location /gengo/ {
        proxy_pass http://gengo-web:5000;
        proxy_set_header Host $host;
    }

    location /gengo/ws {
        proxy_pass http://gengo-ws:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /story/ {
        proxy_pass http://taking-the-story:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
